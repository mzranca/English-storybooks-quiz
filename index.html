<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英文故事單字騎士</title>
<meta name="description" content="從英文繪本故事影片學單字：四選一填空、開口朗讀、追蹤學習成果。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one centered column (max 760px) — a "road" of question cards; sticky top bar with three stops: 故事 / 答題 / 紀錄 */
:root{
  --bg:#f3f6ee; --surface:#ffffff; --surface-2:#e8eedf; --line:#d3dcc6;
  --fg:#22301f; --muted:#5f6d58;
  --accent:#2f7d4f; --accent-ink:#ffffff; --sun:#f2b705; --sun-soft:#fff3c4;
  --good:#2e8b57; --good-soft:#dff2e6; --bad:#c8463a; --bad-soft:#fbe3df;
  --display:"Fredoka","Noto Sans TC",system-ui,sans-serif;
  --body:"Noto Sans TC","Fredoka",system-ui,-apple-system,"Microsoft JhengHei",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a13; --surface:#1d251b; --surface-2:#263022; --line:#34412f;
  --fg:#e8eee2; --muted:#a3b19b; --accent:#5cbf84; --accent-ink:#0f1a12; --sun:#f5c63b; --sun-soft:#3a3315;
  --good:#5cbf84; --good-soft:#1f3a29; --bad:#ef7a6e; --bad-soft:#42221f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a13; --surface:#1d251b; --surface-2:#263022; --line:#34412f;
  --fg:#e8eee2; --muted:#a3b19b; --accent:#5cbf84; --accent-ink:#0f1a12; --sun:#f5c63b; --sun-soft:#3a3315;
  --good:#5cbf84; --good-soft:#1f3a29; --bad:#ef7a6e; --bad-soft:#42221f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
[hidden]{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;border-bottom:2px dashed var(--line);margin-bottom:24px}
.bar .wrap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px;margin-right:auto}
.brand svg{width:36px;height:22px}
.nav{display:flex;gap:6px}
.nav button{border:0;background:transparent;color:var(--muted);padding:6px 14px;border-radius:999px;font-weight:500}
.nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}

/* home */
.lead{color:var(--muted);margin:6px 0 20px}
.stories{display:grid;gap:16px}
.story{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:200px 1fr;overflow:hidden}
.story img{width:100%;height:100%;object-fit:cover;aspect-ratio:16/9;display:block;background:var(--surface-2)}
.story .info{padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.story .meta{color:var(--muted);font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;background:var(--surface-2);border-radius:999px;padding:2px 10px;color:var(--muted)}
.chip.best{background:var(--sun-soft);color:var(--fg)}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.btn{border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 16px;font-weight:700;font-family:var(--display);font-size:16px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{border-color:var(--bad);background:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.howto{margin-top:28px;font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:14px 16px}
.howto code{background:var(--surface-2);padding:1px 6px;border-radius:6px}
@media (max-width:560px){.story{grid-template-columns:1fr}}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.qhead .t{color:var(--muted);font-size:14px}
.road{height:10px;border-radius:999px;background:var(--surface-2);position:relative;margin-bottom:22px;overflow:visible}
.road .fill{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:999px;transition:width .4s}
.road .rider{position:absolute;top:-17px;width:34px;height:22px;transform:translateX(-50%);transition:left .4s;color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px}
.sentence{font-family:var(--display);font-size:clamp(22px,4.4vw,30px);font-weight:500;line-height:1.5}
.blank{display:inline-block;min-width:4.2em;border-bottom:4px solid var(--sun);text-align:center;color:var(--accent)}
.blank.filled{border-color:var(--good);font-weight:700}
.vid{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px;font-size:14px}
.vid a{font-weight:500}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:14px}
.embed{margin-top:12px;aspect-ratio:16/9;max-width:100%;width:100%;border-radius:12px;overflow:hidden;background:#000}
.embed iframe{width:100%;height:100%;border:0;display:block}
.step{margin-top:22px}
.step h3{font-size:15px;color:var(--muted);font-family:var(--body);font-weight:500;margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{border:2px solid var(--line);background:var(--surface);color:var(--fg);border-radius:14px;padding:14px 10px;font-family:var(--display);font-size:22px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shake .35s}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.speak{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--sun-soft);border-radius:14px;padding:16px}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.mic svg{width:34px;height:34px}
.mic.on{background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px color-mix(in srgb,var(--bad) 25%,transparent)}}
.word{font-family:var(--display);font-size:34px;font-weight:700;color:var(--accent);line-height:1}
.heard{font-size:14px;color:var(--muted);min-height:1.6em}
.heard b.ok{color:var(--good)} .heard b.no{color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.done{background:var(--good-soft);border-radius:14px;padding:16px;display:grid;gap:10px}
.done .full{font-family:var(--display);font-size:22px}
.done .full mark{background:var(--sun);color:#22301f;border-radius:6px;padding:0 4px}
.msg{font-size:14px;color:var(--muted)}
.result{text-align:center;display:grid;gap:16px;justify-items:center}
.big{font-family:var(--display);font-size:64px;font-weight:700;color:var(--accent);line-height:1}
.miss{width:100%;text-align:left;display:grid;gap:6px}
.miss div{background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:15px}

/* records */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 28px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.tile .n{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
@media (max-width:620px){.tiles{grid-template-columns:repeat(2,1fr)}}
section.blk{margin-bottom:30px}
section.blk h2{font-size:20px;margin-bottom:12px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
.meter{width:110px;height:8px;background:var(--surface-2);border-radius:99px;display:inline-block;vertical-align:middle;margin-right:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:6px 4px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center}
.pill{display:inline-block;border:0;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500;background:var(--surface-2);color:var(--muted)}
.pill.on{background:var(--good-soft);color:var(--good)}
button.pill.off{color:var(--bad);text-decoration:underline}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button,.filters button{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 14px;font-size:14px}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.filters button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.msum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.msum>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.msum .n{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.msum .l{font-size:13px;color:var(--muted)}
@media (max-width:620px){.msum{grid-template-columns:repeat(2,1fr)}}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
table.words td.sent{white-space:normal;min-width:240px;color:var(--muted)}
table.words td.sent u{color:var(--fg);font-weight:700;text-decoration-color:var(--sun);text-decoration-thickness:3px}
.st{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:500}
.st.ok{background:var(--good-soft);color:var(--good)} .st.learning{background:var(--bad-soft);color:var(--bad)} .st.new{background:var(--surface-2);color:var(--muted)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:middle}
.dot.y{background:var(--good)} .dot.x{background:var(--bad)}
.confirm{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">

</svg>

<header class="bar"><div class="wrap">
  <div class="brand"><svg><use href="#bike"/></svg>英文故事單字騎士</div>
  <nav class="nav" aria-label="頁面">
    <button data-go="home">故事</button>
    <button data-go="quiz" id="navQuiz" disabled>答題</button>
    <button data-go="records">學習紀錄</button>
  </nav>
</div></header>

<main class="wrap">
  <!-- HOME -->
  <section id="v-home" hidden>
    <h1>選一個故事開始練習</h1>
    <p class="lead">看完影片後，從句子裡挑出正確的單字，再大聲唸出來才算過關。</p>
    <div class="stories" id="storyList"></div>
    <div class="howto">
      <b>新增故事：</b>把新的 YouTube 連結交給 Claude，會幫你把字幕整理成題目並更新到這個網頁檔，重新整理頁面就會出現在這裡。<br>
      <b>朗讀功能：</b>請用 Chrome 或 Edge 開啟，並允許使用麥克風。
    </div>
  </section>

  <!-- QUIZ -->
  <section id="v-quiz" hidden>
    <div class="qhead"><h2 id="qTitle"></h2><div class="row"><span id="micStatus"></span><span class="t" id="qCount"></span></div></div>
    <div class="road" aria-hidden="true"><div class="fill" id="roadFill"></div><svg class="rider" id="rider"><use href="#bike"/></svg></div>

    <div class="card" id="qCard">
      <div class="sentence" id="qSentence"></div>
      <div class="vid">
        <a id="qVidLink" target="_blank" rel="noopener">▶ 到 YouTube 看這段</a>
        <button class="linkbtn" id="qEmbedBtn">在這裡播放影片片段</button>
      </div>
      <div class="embed" id="qEmbed" hidden></div>

      <div class="step" id="stepChoose">
        <h3>步驟 1　選出空格裡的單字</h3>
        <div class="opts" id="qOpts"></div>
      </div>

      <div class="step" id="stepSpeak" hidden>
        <h3>步驟 2　按麥克風，大聲唸出這個單字</h3>
        <div class="speak">
          <button class="mic" id="micBtn" aria-label="開始錄音"><svg><use href="#micico"/></svg></button>
          <div>
            <div class="row"><span class="word" id="speakWord"></span><button class="btn ghost" id="hearWord">🔊 聽發音</button></div>
            <div class="heard" id="heard"></div>
            <div class="row" id="speakAlt"></div>
          </div>
        </div>
      </div>

      <div class="step" id="stepDone" hidden>
        <h3>過關！聽聽整句話怎麼唸</h3>
        <div class="done">
          <div class="full" id="fullSentence"></div>
          <div class="row">
            <button class="btn ghost" id="playSent">🔊 再聽一次</button>
            <button class="btn ghost" id="playSlow">🐢 慢速</button>
            <button class="btn" id="nextBtn">下一題 →</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card result" id="qResult" hidden></div>
  </section>

  <!-- RECORDS -->
  <section id="v-records" hidden>
    <h1>學習紀錄</h1>
    <div id="recBody"></div>
  </section>
</main>

<script>
(() => {
const STORIES = window.STORIES || [];
const KEY = "storyQuiz.records.v1";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtT = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pct = (a,b) => b ? Math.round(a/b*100) : 0;

/* ---------- storage ---------- */
function loadRec(){ try { return JSON.parse(localStorage.getItem(KEY)) || {sessions:[]}; } catch(e){ return {sessions:[]}; } }
function saveRec(r){ try { localStorage.setItem(KEY, JSON.stringify(r)); } catch(e){} }

/* ---------- questions ---------- */
function qObj(story, i){
  const [t, s, a, pos, no] = story.questions[i];
  return { i, t, s, a, pos: pos.split(","), no: (no||"").split(",").filter(Boolean) };
}
function pool(story){
  const m = new Map();
  story.questions.forEach(q => m.set(q[2].toLowerCase(), q[3].split(",")));
  (story.extraWords||[]).forEach(([w,p]) => m.set(w, p.split(",")));
  return m;
}
function options(story, q){
  const bad = new Set([...q.pos, ...q.no]);
  const cands = [...pool(story)].filter(([w,p]) => w !== q.a.toLowerCase() && !p.some(x => bad.has(x))).map(([w]) => w);
  const picks = shuffle(cands).slice(0,3);
  const cap = /^[A-Z]/.test(q.a);
  return shuffle([q.a, ...picks.map(w => cap ? w[0].toUpperCase()+w.slice(1) : w)]);
}
function splitSentence(q){
  const re = new RegExp("\\b" + q.a.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b", "i");
  const m = q.s.match(re);
  if (!m) return [q.s, "", ""];
  return [q.s.slice(0,m.index), m[0], q.s.slice(m.index+m[0].length)];
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const HOMO = {know:["no"],see:["sea","c"],way:["weigh"],wait:["weight"],new:["knew"],eat:["it"],still:["steal"],fit:["feet"],full:["fool","fall"],friends:["friend"],wheels:["wheel","we'll"],walk:["work","wok"],should:["shoot"],put:["but"],bed:["bad","bet"],idea:["i'd"],got:["god"],lost:["last"]};
function heardMatches(alts, word){
  const w = word.toLowerCase();
  const ok = new Set([w, ...(HOMO[w]||[])]);
  return alts.some(t => t.toLowerCase().replace(/[^a-z' ]/g," ").split(/\s+/).some(x => ok.has(x)));
}
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices().filter(v => /^en(-|_)/i.test(v.lang));
  voice = vs.find(v => /Google US English/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang) && /Natural|Samantha|Aria|Jenny/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, rate=0.9){
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = rate; if (voice) u.voice = voice;
  // the mic stays open during a quiz, so ignore what it hears while the computer is talking
  mic.ignoreUntil = Date.now() + Math.min(15000, 1500 + text.length * 90 / rate);
  u.onend = u.onerror = () => { mic.ignoreUntil = Date.now() + 700; };
  speechSynthesis.speak(u);
}

/* ---------- one microphone session per quiz (asks permission once) ---------- */
const mic = { stream: null, rec: null, want: false, running: false, denied: false, err: "", fails: 0, ignoreUntil: 0 };
async function micStart(){
  if (!SR || mic.denied) { micUI(); return; }
  mic.want = true; mic.err = "";
  if (mic.pending) return;
  if (!mic.stream && navigator.mediaDevices && navigator.mediaDevices.getUserMedia){
    mic.pending = true; micUI();
    try { mic.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch(e){ mic.denied = true; mic.want = false; mic.pending = false; micUI(); return; }
    mic.pending = false;
  }
  if (mic.running || mic.rec || !mic.want) return;
  const r = new SR();
  r.lang = "en-US"; r.continuous = true; r.interimResults = false; r.maxAlternatives = 5;
  r.onstart = () => { mic.running = true; micUI(); };
  r.onresult = e => {
    mic.fails = 0;
    for (let i = e.resultIndex; i < e.results.length; i++){
      const res = e.results[i]; if (!res.isFinal) continue;
      const alts = []; for (let k = 0; k < res.length; k++) alts.push(res[k].transcript.trim());
      onHeard(alts);
    }
  };
  r.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed"){ mic.denied = true; mic.want = false; }
    else if (e.error === "audio-capture"){ mic.err = "找不到麥克風，請確認麥克風有接好。"; mic.want = false; }
    else if (e.error === "network"){ mic.err = "語音辨識需要網路連線。"; mic.fails++; }
    else if (e.error !== "no-speech" && e.error !== "aborted"){ mic.fails++; }
    if (mic.fails >= 5) mic.want = false;
    micUI();
  };
  r.onend = () => {
    mic.running = false; mic.rec = null; micUI();
    if (mic.want) setTimeout(() => { if (mic.want && !mic.rec) micStart(); }, 300);
  };
  mic.rec = r;
  try { r.start(); } catch(e){ mic.rec = null; }
}
function micStop(){
  mic.want = false;
  try { mic.rec && mic.rec.stop(); } catch(e){}
  if (mic.stream){ mic.stream.getTracks().forEach(t => t.stop()); mic.stream = null; }
}
function micUI(){
  const st = $("#micStatus"); if (!st) return;
  if (!SR){ st.innerHTML = `<span class="pill off">此瀏覽器不支援語音辨識</span>`; }
  else if (mic.denied){ st.innerHTML = `<span class="pill off">麥克風未允許</span>`; }
  else if (mic.running){ st.innerHTML = `<span class="pill on">● 麥克風已開啟</span>`; }
  else { st.innerHTML = `<button class="pill off" id="micRetry">麥克風未開啟．點我開啟</button>`; $("#micRetry").onclick = () => { mic.fails = 0; micStart(); }; }
  const listening = mic.running && quiz && quiz.phase === "speak";
  $("#micBtn").classList.toggle("on", !!listening);
  if (quiz && quiz.phase === "speak" && !quiz.cur.heard){
    $("#heard").textContent = !SR ? "這個瀏覽器不支援語音辨識，請改用 Chrome 或 Edge；或由家長聽過後按下方按鈕。"
      : mic.denied ? "麥克風沒有被允許。請點網址列左邊的圖示允許麥克風，再重新整理頁面；或由家長聽過後按下方按鈕。"
      : mic.err ? mic.err
      : mic.running ? "麥克風正在聽，直接大聲唸出這個單字！" : "麥克風開啟中…";
    renderSpeakAlt();
  }
}

/* ---------- routing ---------- */
let quiz = null;
function show(view){
  if (view === "quiz" && !quiz) view = "home";
  ["home","quiz","records"].forEach(v => { $("#v-"+v).hidden = v !== view; });
  document.querySelectorAll(".nav button").forEach(b => { if (b.dataset.go === view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#navQuiz").disabled = !quiz;
  if (view === "home") renderHome();
  if (view === "records") renderRecords();
  if (view === "quiz" && quiz && !quiz.finished) micStart(); else micStop();
  if (location.hash !== "#"+view) history.replaceState(null, "", "#"+view);
  window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b => b.onclick = () => show(b.dataset.go));
window.addEventListener("hashchange", () => show(location.hash.slice(1) || "home"));

/* ---------- home ---------- */
function storyStats(id){
  const ss = loadRec().sessions.filter(s => s.storyId === id);
  let n=0, c=0, sp=0, best=null;
  ss.forEach(s => { const k=s.items.length; if(!k) return; const cc=s.items.filter(x=>x.firstTry).length; n+=k; c+=cc; sp+=s.items.filter(x=>x.speak==="pass"||x.speak==="manual").length; if(k>=5) best=Math.max(best??0, pct(cc,k)); });
  return { sessions: ss.filter(s=>s.items.length).length, n, c, sp, best };
}
function wrongIdx(id){
  // keep a word in review until its latest attempt was fully correct
  const last = new Map();
  loadRec().sessions.filter(s => s.storyId === id).sort((a,b)=>a.date-b.date).forEach(s => s.items.forEach(x => last.set(x.qi, x.firstTry && x.speak!=="fail")));
  const st = STORIES.find(s => s.id === id), max = st ? st.questions.length : 0;
  return [...last].filter(([i,ok]) => !ok && i < max).map(([i]) => i);
}
function renderHome(){
  const el = $("#storyList");
  if (!STORIES.length){ el.innerHTML = '<div class="empty">還沒有故事。</div>'; return; }
  el.innerHTML = STORIES.map((st, si) => {
    const s = storyStats(st.id), w = wrongIdx(st.id).length, n = st.questions.length;
    return `<article class="story">
      <img src="https://i.ytimg.com/vi/${esc(st.youtubeId)}/hqdefault.jpg" alt="${esc(st.title)} 影片縮圖" loading="lazy">
      <div class="info">
        <h2>${esc(st.title)}</h2>
        <div class="meta">${esc(st.series||"")} · 影片 ${fmtT(st.duration||0)} · <a href="https://www.youtube.com/watch?v=${esc(st.youtubeId)}" target="_blank" rel="noopener">先看影片</a></div>
        <div class="chips"><span class="chip">${n} 個單字題</span><span class="chip">已練習 ${s.sessions} 次</span>${s.best!=null?`<span class="chip best">最佳 ${s.best}%</span>`:""}</div>
        <div class="modes">
          <button class="btn" data-s="${si}" data-m="ten">隨機 10 題</button>
          <button class="btn ghost" data-s="${si}" data-m="all">全部 ${n} 題（照故事順序）</button>
          <button class="btn ghost" data-s="${si}" data-m="wrong" ${w?"":"disabled"}>錯題複習${w?`（${w}）`:""}</button>
        </div>
      </div></article>`;
  }).join("");
  el.querySelectorAll("button[data-s]").forEach(b => b.onclick = () => startQuiz(+b.dataset.s, b.dataset.m));
}

/* ---------- quiz ---------- */
function startQuiz(si, mode){
  const st = STORIES[si];
  let idx = st.questions.map((_,i)=>i);
  if (mode === "ten") idx = shuffle(idx).slice(0,10).sort((a,b)=>a-b);
  if (mode === "wrong") idx = wrongIdx(st.id).filter(i => i < st.questions.length).sort((a,b)=>a-b);
  if (!idx.length) return;
  const rec = loadRec();
  const session = { id: Date.now().toString(36), storyId: st.id, title: st.title, mode, date: Date.now(), total: idx.length, items: [] };
  rec.sessions = rec.sessions.filter(s => s.items && s.items.length);
  rec.sessions.push(session); saveRec(rec);
  quiz = { st, idx, pos: 0, session, cur: null };
  $("#qResult").hidden = true; $("#qCard").hidden = false;
  show("quiz"); renderQ();
}
function persist(){
  const rec = loadRec();
  const k = rec.sessions.findIndex(s => s.id === quiz.session.id);
  if (k >= 0) rec.sessions[k] = quiz.session; else rec.sessions.push(quiz.session);
  saveRec(rec);
}
function renderQ(){
  const { st, idx, pos } = quiz;
  const q = qObj(st, idx[pos]);
  quiz.cur = { q, wrong: [], tries: 0, firstTry: true };
  quiz.phase = "choose"; micUI();
  $("#qTitle").textContent = st.title;
  $("#qCount").textContent = `第 ${pos+1} / ${idx.length} 題`;
  const p = pos / idx.length * 100;
  $("#roadFill").style.width = p + "%"; $("#rider").style.left = `calc(17px + (100% - 34px) * ${p/100})`;
  const [pre,, post] = splitSentence(q);
  $("#qSentence").innerHTML = `${esc(pre)}<span class="blank" id="blank">?</span>${esc(post)}`;
  const start = Math.max(0, q.t - 1);
  $("#qVidLink").href = `https://www.youtube.com/watch?v=${st.youtubeId}&t=${start}s`;
  $("#qVidLink").textContent = `▶ 到 YouTube 看這段（${fmtT(start)}）`;
  $("#qEmbed").hidden = true; $("#qEmbed").innerHTML = ""; $("#qEmbedBtn").textContent = "在這裡播放影片片段";
  $("#stepChoose").hidden = false; $("#stepSpeak").hidden = true; $("#stepDone").hidden = true;
  $("#qOpts").innerHTML = options(st, q).map(o => `<button class="opt" data-w="${esc(o)}">${esc(o)}</button>`).join("");
  $("#qOpts").querySelectorAll(".opt").forEach(b => b.onclick = () => choose(b));
}
$("#qEmbedBtn").onclick = () => {
  const box = $("#qEmbed");
  if (!box.hidden){ box.hidden = true; box.innerHTML = ""; $("#qEmbedBtn").textContent = "在這裡播放影片片段"; return; }
  const q = quiz.cur.q, start = Math.max(0, q.t - 1);
  if (location.protocol === "file:") {
    box.innerHTML = `<div style="color:#fff;padding:20px;display:grid;gap:10px;place-content:center;height:100%;text-align:center;font-size:15px">
      <div>YouTube 不允許「直接從電腦開啟的檔案」內嵌播放影片。</div>
      <div>把這個網頁放到 GitHub Pages 等網站上，就能在同一頁播放。</div>
      <a href="https://www.youtube.com/watch?v=${quiz.st.youtubeId}&t=${start}s" target="_blank" rel="noopener" style="color:#f5c63b">先到 YouTube 看這段（${fmtT(start)}）</a></div>`;
  } else {
    const origin = encodeURIComponent(location.origin);
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${quiz.st.youtubeId}?start=${start}&end=${start+12}&autoplay=1&rel=0&playsinline=1&origin=${origin}" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="影片片段"></iframe>`;
  }
  box.hidden = false; $("#qEmbedBtn").textContent = "關閉影片";
};
function choose(b){
  const c = quiz.cur, w = b.dataset.w;
  if (w.toLowerCase() === c.q.a.toLowerCase()){
    b.classList.add("right");
    $("#qOpts").querySelectorAll(".opt").forEach(x => x.disabled = true);
    const bl = $("#blank"); bl.textContent = c.q.a; bl.classList.add("filled");
    setTimeout(toSpeak, 450);
  } else {
    c.firstTry = false; c.wrong.push(w);
    b.classList.add("wrong"); b.disabled = true;
  }
}
function toSpeak(){
  const c = quiz.cur;
  quiz.phase = "speak"; c.heard = false;
  mic.ignoreUntil = Math.max(mic.ignoreUntil, Date.now() + 300);
  $("#stepChoose").hidden = true; $("#stepSpeak").hidden = false;
  $("#speakWord").textContent = c.q.a;
  if (SR && !mic.denied && !mic.want) micStart();
  micUI();
}
function renderSpeakAlt(){
  const c = quiz.cur, box = $("#speakAlt");
  box.innerHTML = "";
  if (!SR || mic.denied || (mic.err && !mic.running)){ box.innerHTML = `<button class="btn ghost" id="manualOk">家長確認唸對了</button>`; $("#manualOk").onclick = () => finishQ("manual"); return; }
  if (c.tries >= 3){ box.innerHTML = `<button class="btn ghost" id="skipSpeak">先跳過（記錄為朗讀未通過）</button>`; $("#skipSpeak").onclick = () => finishQ("fail"); }
}
function onHeard(alts){
  if (!quiz || quiz.phase !== "speak" || quiz.cur.done) return;
  if (Date.now() < mic.ignoreUntil) return;
  const c = quiz.cur;
  c.tries++; c.heard = true;
  if (heardMatches(alts, c.q.a)){
    c.done = true;
    $("#heard").innerHTML = `聽到：<b class="ok">${esc(alts[0])}</b>　唸對了！`;
    setTimeout(() => finishQ("pass"), 600);
  } else {
    $("#heard").innerHTML = `聽到：<b class="no">${esc(alts[0]||"（沒聽清楚）")}</b>　再試一次，可以先按「聽發音」跟著唸。`;
    renderSpeakAlt();
  }
}
$("#hearWord").onclick = () => say(quiz.cur.q.a, 0.8);
$("#micBtn").onclick = () => { if (SR && !mic.running){ mic.fails = 0; micStart(); } };
function finishQ(speak){
  const c = quiz.cur;
  if (quiz.phase !== "speak") return;
  quiz.phase = "done"; c.done = true; micUI();
  quiz.session.items.push({ qi: c.q.i, word: c.q.a, firstTry: c.firstTry, wrongPicks: c.wrong, speak, speakTries: c.tries });
  persist();
  $("#stepSpeak").hidden = true; $("#stepDone").hidden = false;
  const [pre, mid, post] = splitSentence(c.q);
  $("#fullSentence").innerHTML = `${esc(pre)}<mark>${esc(mid)}</mark>${esc(post)}`;
  $("#nextBtn").textContent = quiz.pos + 1 < quiz.idx.length ? "下一題 →" : "看結果 →";
  say(c.q.s);
}
$("#playSent").onclick = () => say(quiz.cur.q.s);
$("#playSlow").onclick = () => say(quiz.cur.q.s, 0.6);
$("#nextBtn").onclick = () => {
  if (window.speechSynthesis) speechSynthesis.cancel();
  quiz.pos++;
  if (quiz.pos < quiz.idx.length) { renderQ(); window.scrollTo(0,0); }
  else showResult();
};
function showResult(){
  quiz.finished = true; quiz.phase = "end"; micStop();
  const s = quiz.session, n = s.items.length;
  const c = s.items.filter(x => x.firstTry).length, sp = s.items.filter(x => x.speak === "pass" || x.speak === "manual").length;
  $("#roadFill").style.width = "100%"; $("#rider").style.left = "calc(100% - 17px)";
  const miss = s.items.filter(x => !x.firstTry || x.speak === "fail");
  $("#qCard").hidden = true;
  const r = $("#qResult"); r.hidden = false;
  r.innerHTML = `<h2>騎到終點了！</h2>
    <div class="big">${pct(c,n)}%</div>
    <div>選擇題一次答對 <b>${c} / ${n}</b>　·　朗讀通過 <b>${sp} / ${n}</b></div>
    ${miss.length ? `<div class="miss"><b>需要再練的單字</b>${miss.map(x => `<div><b>${esc(x.word)}</b>${x.wrongPicks.length?`　選錯：${x.wrongPicks.map(esc).join("、")}`:""}${x.speak==="fail"?"　朗讀未通過":""}</div>`).join("")}</div>` : `<div>全部一次答對，太厲害了！</div>`}
    <div class="row" style="justify-content:center">
      ${miss.length ? `<button class="btn" id="rWrong">練習錯題</button>` : ""}
      <button class="btn ghost" id="rHome">回到故事</button>
      <button class="btn ghost" id="rRec">看學習紀錄</button>
    </div>`;
  const si = STORIES.indexOf(quiz.st);
  if (miss.length) $("#rWrong").onclick = () => startQuiz(si, "wrong");
  $("#rHome").onclick = () => show("home");
  $("#rRec").onclick = () => show("records");
}

/* ---------- records ---------- */
let confirmClear = false, recStory = null, recFilter = "all";
const isPass = x => x.speak === "pass" || x.speak === "manual";
function renderMastery(){
  const box = $("#mastery"); if (!box) return;
  const st = STORIES.find(s => s.id === recStory); if (!st) return;
  const sessions = loadRec().sessions.filter(s => s.storyId === st.id && s.items.length).sort((a,b) => a.date - b.date);
  const att = st.questions.map(() => []);
  sessions.forEach(s => s.items.forEach(x => { if (att[x.qi]) att[x.qi].push({ ...x, date: s.date }); }));
  const rows = st.questions.map((q, i) => {
    const a = att[i], n = a.length, last = a[n-1];
    const status = !n ? "new" : (last.firstTry && isPass(last)) ? "ok" : "learning";
    return { i, q, n, c: a.filter(x => x.firstTry).length, sp: a.filter(isPass).length, recent: a.slice(-6), status, wrongPicks: a.flatMap(x => x.wrongPicks) };
  });
  const N = rows.length, ok = rows.filter(r => r.status === "ok").length, lrn = rows.filter(r => r.status === "learning").length, nw = N - ok - lrn;
  const tn = rows.reduce((s,r) => s + r.n, 0), tc = rows.reduce((s,r) => s + r.c, 0), tsp = rows.reduce((s,r) => s + r.sp, 0);
  const shown = rows.filter(r => recFilter === "all" || (recFilter === "todo" ? r.status === "learning" : recFilter === "new" ? r.status === "new" : r.status === "ok"));
  const label = { ok: "已學會", learning: "還沒學會", new: "未練習" };
  box.innerHTML = `<h2>單字掌握度</h2>
    <div class="tabs" role="tablist">${STORIES.map(s => `<button role="tab" aria-selected="${s.id === st.id}" data-st="${esc(s.id)}">${esc(s.title)}</button>`).join("")}</div>
    <div class="msum">
      <div><div class="n">${ok} / ${N}</div><div class="l">已學會的單字</div></div>
      <div><div class="n">${pct(tc,tn)}%</div><div class="l">這個故事選擇題答對率（${tc}/${tn}）</div></div>
      <div><div class="n">${pct(tsp,tn)}%</div><div class="l">這個故事朗讀通過率</div></div>
      <div><div class="n">${pct(N-nw,N)}%</div><div class="l">已練習過的單字比例</div></div>
    </div>
    <div class="stack" aria-label="已學會 ${ok}、還沒學會 ${lrn}、未練習 ${nw}">
      <i style="width:${ok/N*100}%;background:var(--good)"></i><i style="width:${lrn/N*100}%;background:var(--bad)"></i><i style="width:${nw/N*100}%;background:var(--surface-2)"></i>
    </div>
    <div class="legend"><span style="--c:var(--good)">已學會 ${ok}</span><span style="--c:var(--bad)">還沒學會 ${lrn}</span><span style="--c:var(--line)">未練習 ${nw}</span></div>
    <p class="msg">「已學會」= 最近一次作答時，選擇題一次就選對、而且朗讀通過。</p>
    <div class="filters">${[["all","全部"],["todo","還沒學會"],["new","未練習"],["ok","已學會"]].map(([k,t]) => `<button data-f="${k}" aria-pressed="${recFilter===k}">${t}</button>`).join("")}</div>
    ${shown.length ? `<div class="tbl"><table class="words"><thead><tr><th>#</th><th>單字</th><th>句子</th><th>狀態</th><th>選擇題答對</th><th>朗讀通過</th><th>最近作答</th><th>曾誤選</th></tr></thead><tbody>
    ${shown.map(r => { const [pre, mid, post] = splitSentence(qObj(st, r.i)); return `<tr>
      <td>${r.i+1}</td><td><b>${esc(r.q[2])}</b></td>
      <td class="sent">${esc(pre)}<u>${esc(mid)}</u>${esc(post)}</td>
      <td><span class="st ${r.status}">${label[r.status]}</span></td>
      <td>${r.n ? `${r.c}/${r.n}（${pct(r.c,r.n)}%）` : "—"}</td>
      <td>${r.n ? `${r.sp}/${r.n}` : "—"}</td>
      <td>${r.recent.map(x => `<span class="dot ${x.firstTry && isPass(x) ? "y" : "x"}" title="${new Date(x.date).toLocaleDateString("zh-TW")}：${x.firstTry ? "選對" : "選錯"}、${isPass(x) ? "朗讀通過" : "朗讀未過"}"></span>`).join("") || "—"}</td>
      <td>${[...new Set(r.wrongPicks)].slice(0,3).map(esc).join("、") || "—"}</td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">這個分類目前沒有單字。</div>`}`;
  box.querySelectorAll("[data-st]").forEach(b => b.onclick = () => { recStory = b.dataset.st; recFilter = "all"; renderMastery(); });
  box.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { recFilter = b.dataset.f; renderMastery(); });
}
function renderRecords(){
  const all = loadRec().sessions.filter(s => s.items.length);
  const body = $("#recBody");
  if (!all.length){ body.innerHTML = `<p class="lead">完成第一題後，答題結果會自動記錄在這裡。</p><div class="empty">還沒有紀錄。回到「故事」選一個開始練習吧。</div>`; return; }
  const items = all.flatMap(s => s.items.map(x => ({...x, storyId: s.storyId, title: s.title})));
  const n = items.length, c = items.filter(x => x.firstTry).length, sp = items.filter(x => x.speak==="pass"||x.speak==="manual").length;

  // per story
  const byStory = new Map();
  all.forEach(s => { const o = byStory.get(s.storyId) || {id:s.storyId, title:s.title, sessions:0, n:0, c:0, sp:0, last:0}; o.sessions++; o.n+=s.items.length; o.c+=s.items.filter(x=>x.firstTry).length; o.sp+=s.items.filter(x=>x.speak==="pass"||x.speak==="manual").length; o.last=Math.max(o.last,s.date); byStory.set(s.storyId,o); });

  // words
  const byWord = new Map();
  items.forEach(x => { const k = x.storyId+"|"+x.word; const o = byWord.get(k) || {word:x.word, title:x.title, n:0, wrong:0, sfail:0, picks:{}}; o.n++; if(!x.firstTry) o.wrong++; if(x.speak==="fail") o.sfail++; x.wrongPicks.forEach(p => o.picks[p]=(o.picks[p]||0)+1); byWord.set(k,o); });
  const weak = [...byWord.values()].filter(o => o.wrong || o.sfail).sort((a,b) => (b.wrong+b.sfail)/b.n - (a.wrong+a.sfail)/a.n || b.n - a.n).slice(0,20);

  // chart of last 15 sessions
  const last = all.slice(-15);
  const W = 640, H = 220, L = 36, B = 30, T = 14, R = 10, cw = (W-L-R)/Math.max(last.length,1), bw = Math.min(16, cw/2.8);
  const y = v => T + (H-T-B) * (1 - v/100);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="最近 ${last.length} 次練習的正確率">`;
  [0,50,100].forEach(v => { svg += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="${v?4:0}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}%</text>`; });
  last.forEach((s,i) => {
    const k = s.items.length, a = pct(s.items.filter(x=>x.firstTry).length,k), b = pct(s.items.filter(x=>x.speak==="pass"||x.speak==="manual").length,k);
    const cx = L + cw*i + cw/2, d = new Date(s.date);
    svg += `<rect x="${cx-bw-1}" y="${y(a)}" width="${bw}" height="${y(0)-y(a)}" rx="3" fill="var(--accent)"><title>選擇題 ${a}%</title></rect>`;
    svg += `<rect x="${cx+1}" y="${y(b)}" width="${bw}" height="${y(0)-y(b)}" rx="3" fill="var(--sun)"><title>朗讀 ${b}%</title></rect>`;
    svg += `<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${d.getMonth()+1}/${d.getDate()}</text>`;
  });
  svg += `</svg>`;

  body.innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="n">${pct(c,n)}%</div><div class="l">選擇題一次答對率</div></div>
      <div class="tile"><div class="n">${pct(sp,n)}%</div><div class="l">朗讀通過率</div></div>
      <div class="tile"><div class="n">${n}</div><div class="l">累計作答題數</div></div>
      <div class="tile"><div class="n">${all.length}</div><div class="l">練習次數</div></div>
    </div>
    <section class="blk"><h2>最近 ${last.length} 次練習</h2>
      <div class="chart">${svg}</div>
      <div class="legend"><span style="--c:var(--accent)">選擇題一次答對</span><span style="--c:var(--sun)">朗讀通過</span></div>
    </section>
    <section class="blk"><h2>各故事成績</h2>
      <div class="tbl"><table><thead><tr><th>故事</th><th>次數</th><th>題數</th><th>選擇題正確率</th><th>朗讀通過率</th><th>最近練習</th><th></th></tr></thead><tbody>
      ${[...byStory.values()].map(o => `<tr><td>${esc(o.title)}</td><td>${o.sessions}</td><td>${o.n}</td><td><span class="meter"><i style="width:${pct(o.c,o.n)}%"></i></span>${pct(o.c,o.n)}%</td><td><span class="meter"><i style="width:${pct(o.sp,o.n)}%;background:var(--sun)"></i></span>${pct(o.sp,o.n)}%</td><td>${new Date(o.last).toLocaleDateString("zh-TW")}</td><td><button class="linkbtn" data-detail="${esc(o.id)}">查看單字細節</button></td></tr>`).join("")}
      </tbody></table></div>
    </section>
    <section class="blk" id="mastery"></section>
    <section class="blk"><h2>常錯單字</h2>
      ${weak.length ? `<div class="tbl"><table><thead><tr><th>單字</th><th>故事</th><th>作答</th><th>選錯</th><th>朗讀未過</th><th>錯誤率</th><th>常被誤選成</th></tr></thead><tbody>
      ${weak.map(o => `<tr><td><b>${esc(o.word)}</b></td><td>${esc(o.title)}</td><td>${o.n}</td><td>${o.wrong}</td><td>${o.sfail}</td><td>${pct(Math.max(o.wrong,o.sfail),o.n)}%</td><td>${Object.entries(o.picks).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([w,k])=>`${esc(w)}×${k}`).join("、")||"—"}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">目前沒有答錯的單字。</div>`}
    </section>
    <section class="blk"><h2>練習明細</h2>
      <div class="tbl"><table><thead><tr><th>日期時間</th><th>故事</th><th>模式</th><th>完成</th><th>選擇題</th><th>朗讀</th></tr></thead><tbody>
      ${all.slice().reverse().slice(0,50).map(s => { const k=s.items.length; return `<tr><td>${new Date(s.date).toLocaleString("zh-TW",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"})}</td><td>${esc(s.title)}</td><td>${({ten:"隨機10題",all:"全部",wrong:"錯題複習"})[s.mode]||s.mode}</td><td>${k}/${s.total}</td><td>${pct(s.items.filter(x=>x.firstTry).length,k)}%</td><td>${pct(s.items.filter(x=>x.speak==="pass"||x.speak==="manual").length,k)}%</td></tr>`; }).join("")}
      </tbody></table></div>
    </section>
    <div class="confirm" id="clearBox"></div>`;
  if (!recStory || !STORIES.some(s => s.id === recStory)) recStory = (STORIES.find(s => byStory.has(s.id)) || STORIES[0]).id;
  body.querySelectorAll("[data-detail]").forEach(b => b.onclick = () => { recStory = b.dataset.detail; recFilter = "all"; renderMastery(); $("#mastery").scrollIntoView({behavior:"smooth"}); });
  renderMastery();
  renderClear();
}
function renderClear(){
  const box = $("#clearBox"); if (!box) return;
  box.innerHTML = confirmClear
    ? `<span>確定要刪除所有紀錄嗎？無法復原。</span><button class="btn warn" id="clrYes">確定刪除</button><button class="btn ghost" id="clrNo">取消</button>`
    : `<button class="btn ghost" id="clr">清除所有紀錄</button>`;
  if (confirmClear){ $("#clrYes").onclick = () => { saveRec({sessions:[]}); confirmClear=false; renderRecords(); }; $("#clrNo").onclick = () => { confirmClear=false; renderClear(); }; }
  else $("#clr").onclick = () => { confirmClear = true; renderClear(); };
}

show((location.hash.slice(1)) || "home");
})();
</script>
</body>
</html>
